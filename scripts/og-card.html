<!doctype html>
<!--
  Social card source for public/og-image.png.
  Concept: "The Round Table of Legends" — the product itself, not the app's UI.
  A ring of real legendary thinkers (spanning eras + cultures) seated around one
  central question, faint madder threads showing them in debate across the table.
  Brand palette/type only: paper · ink · madder + Fraunces / Cormorant / Spectral.

  Render (renders at 2× → public/og-image.png is 2400×1260, ratio 1.91:1):
    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/og-image.png scripts/og-card.html

  Keep the 161/18 counts in sync with presets.ts (see AGENTS.md "Marketing copy").
  The logo (public/logo.svg) distils the same emblem: a round table with seats
  converging on the madder question dot.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Cormorant:ital,wght@0,500;0,600;0,700;1,600&family=Spectral:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EC; --paper-deep:#EFECDF;
    --ink:#211F19; --ink-soft:#5C584C; --ink-faint:#8E887A;
    --madder:#8C2F39; --rule:#CCC5AE; --rule-faint:#DFD9C6;
    --display:'Cormorant','Noto Serif SC',serif;
    --body:'Spectral','Noto Serif SC',serif;
    --brand:'Fraunces',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;}

  /* faint page hairlines */
  .pl{position:absolute;left:64px;right:64px;height:1px;background:var(--rule-faint);}
  .pl.top{top:30px;} .pl.bot{bottom:28px;}

  /* ── left identity ── */
  .rail{position:absolute;left:70px;top:0;bottom:0;width:430px;
        display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:var(--display);font-size:16px;font-weight:600;
           letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);}
  .eyebrow .zh{font-family:'Noto Serif SC',serif;letter-spacing:.2em;color:var(--ink-soft);}
  .wm{margin-top:22px;}
  .wm .legend{display:block;font-family:var(--brand);font-weight:700;font-size:90px;
              line-height:.9;letter-spacing:.004em;color:var(--ink);}
  .wm .talk{display:block;font-family:var(--brand);font-weight:600;font-style:italic;
            font-size:94px;line-height:.96;color:var(--madder);margin-top:2px;}
  .mrule{width:64px;height:2px;background:var(--madder);margin-top:24px;}
  .tag{font-family:var(--display);font-style:italic;font-weight:600;font-size:28px;
       line-height:1.26;color:var(--ink-soft);margin-top:22px;max-width:360px;}
  .stats{font-family:var(--body);font-size:20px;color:var(--ink-soft);margin-top:30px;letter-spacing:.01em;}
  .stats b{font-family:var(--display);font-weight:700;font-size:23px;color:var(--ink);}
  .stats .sep{color:var(--rule);margin:0 9px;}
  .url{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.26em;
       text-transform:uppercase;color:var(--ink-faint);margin-top:14px;}

  /* ── right emblem ── */
  #emblem{position:absolute;inset:0;pointer-events:none;}
  .seat{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;}
  .seat .nm{font-family:var(--display);font-weight:600;font-size:19px;line-height:1;color:var(--ink);}
  .seat .er{font-family:var(--display);font-style:italic;font-size:13px;color:var(--ink-faint);margin-top:3px;}
  .qbox{position:absolute;transform:translate(-50%,-50%);text-align:center;width:230px;}
  .qbox .ql{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.32em;
            text-transform:uppercase;color:var(--ink-faint);}
  .qbox .qt{font-family:var(--display);font-style:italic;font-weight:600;font-size:31px;
            line-height:1.12;color:var(--ink);margin-top:7px;}
  .qbox .qu{width:42px;height:2px;background:var(--madder);margin:11px auto 0;}
</style>
</head>
<body>
  <div class="card">
    <div class="pl top"></div><div class="pl bot"></div>

    <div class="rail">
      <div class="eyebrow">AI&nbsp;Roundtable&nbsp;&nbsp;<span class="zh">圆桌辩论</span></div>
      <div class="wm"><span class="legend">Legend</span><span class="talk">Talk</span></div>
      <div class="mrule"></div>
      <div class="tag">History&rsquo;s greatest minds<br>debate your question.</div>
      <div class="stats"><b>161</b>&nbsp;thinkers<span class="sep">·</span><b>18</b>&nbsp;languages<span class="sep">·</span>free</div>
      <div class="url">talk.newzone.top</div>
    </div>

    <svg id="emblem" viewBox="0 0 1200 630"></svg>
    <div id="seats"></div>
  </div>

<script>
  const NS='http://www.w3.org/2000/svg';
  const cx=876, cy=315, Rtick=198, Rname=250, Rdisc=120;
  // A spread across eras + cultures (incl. women + non-Western); ordered chronologically.
  const legends=[
    {n:'Confucius',  e:'551 BC'},
    {n:'Socrates',   e:'470 BC'},
    {n:'Hypatia',    e:'AD 360'},
    {n:'Avicenna',   e:'980'},
    {n:'da Vinci',   e:'1452'},
    {n:'Newton',     e:'1643'},
    {n:'Kant',       e:'1724'},
    {n:'Darwin',     e:'1809'},
    {n:'Nietzsche',  e:'1844'},
    {n:'de Beauvoir',e:'1908'},
  ];
  const svg=document.getElementById('emblem');
  const seats=document.getElementById('seats');
  const mk=(t,a)=>{const el=document.createElementNS(NS,t);for(const k in a)el.setAttribute(k,a[k]);return el;};

  const N=legends.length;
  const pt=i=>{const a=(-90+i*360/N)*Math.PI/180;return [cx+Rtick*Math.cos(a), cy+Rtick*Math.sin(a)];};

  // argument threads — thinkers in dialogue across the table
  const chords=[[0,4],[1,6],[2,7],[3,9],[5,8],[1,4],[2,9]];
  chords.forEach(([a,b])=>{const[x1,y1]=pt(a),[x2,y2]=pt(b);
    svg.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#8C2F39','stroke-width':1,opacity:.3}));});

  // central question medallion masks the thread crossings
  svg.appendChild(mk('circle',{cx,cy,r:Rdisc,fill:'#F6F4EC'}));
  svg.appendChild(mk('circle',{cx,cy,r:Rdisc,fill:'none',stroke:'#8E887A','stroke-width':1,opacity:.4}));
  // table ring
  svg.appendChild(mk('circle',{cx,cy,r:Rtick,fill:'none',stroke:'#5C584C','stroke-width':1,opacity:.55}));

  legends.forEach((p,i)=>{
    const ang=(-90 + i*360/N)*Math.PI/180;
    const c=Math.cos(ang), s=Math.sin(ang);
    // seat marker
    svg.appendChild(mk('circle',{cx:cx+Rtick*c,cy:cy+Rtick*s,r:2.8,fill:'#8C2F39'}));
    // name label
    const d=document.createElement('div');
    d.className='seat';
    d.style.left=(cx+Rname*c)+'px';
    d.style.top=(cy+Rname*s)+'px';
    d.innerHTML='<div class="nm">'+p.n+'</div><div class="er">'+p.e+'</div>';
    seats.appendChild(d);
  });

  // central question
  const q=document.createElement('div');
  q.className='qbox';
  q.style.left=cx+'px'; q.style.top=cy+'px';
  q.innerHTML='<div class="ql">The Question</div><div class="qt">What makes<br>a life good?</div><div class="qu"></div>';
  seats.appendChild(q);
</script>
</body>
</html>
